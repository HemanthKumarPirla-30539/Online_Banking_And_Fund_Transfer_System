spring.datasource.url=jdbc:h2:mem:fund_transfer_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Beneficiary cooling period in minutes.
# For production, set this value to 1440 for a 24-hour cooling period.
beneficiary.cooling-period-minutes=1

jwt.secret=MySuperSecretKeyForJWTsMySuperSecretKeyForJWTs
jwt.expiration-ms=86400000
